{{# is_authenticated }}
<nav class="user-menu authed" aria-label="User account">
  <a href="#" id="sign-in-btn">{{#with (current_user "avatar_url")}}<img class="avatar header-avatar" src="{{ this }}">{{^}}<img class="avatar header-avatar" src="{{ STATIC_URL }}css/images/user-50.png">{{/with}}</a>
  <ul class="menu sign-in-menu">
    <li><span class="signed-in-as">{{#_}}Signed in as{{/_}}</span> <span class="current-user">{{ current_user "username" }}</span></li>
    <li class=""><a class="logout-btn" href="/users/logout/">{{#_}}Log Out{{/_}}</a>
    </li>
  </ul>
</nav>
{{ else }}
<nav class="user-menu" aria-label="User account">
  <a href="/page/signin" class="sign-in-link">{{#_}}Sign In{{/_}}</a>
</nav>
{{/ is_authenticated }}
