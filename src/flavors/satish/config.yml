# Settings for the app
app:
  # HTML Title
  title: KothaKhoj
  # Header name
  name: KothaKhoj
  # Meta description that will show up in Google search results
  meta_description: _(KothaKhoj helps students and renters in Butwal, Nepal find rooms and flats for rent on a map. Browse listings near your college, see rent and location, and contact owners directly. कोठा खोज्नुहोस्, सजिलै।)
  # Meta author that will show up in Google search results
  meta_author: KothaKhoj


  # When the map loads, existing places will be loaded in chunks. By default,
  # the size of the chunks will be a reasonable default dictated by the API
  # server. If you would like to override the chunk size, use this setting:
  # places_page_size: 100

  # Optional. List view is supported by default. Set to false to disable.
  # list_enabled: false

# Settings for map and layer configs
map:
  geolocation_enabled: true
  geolocation_onload: false

  geocoding_enabled: true
  # The default geocoding engine is MapQuest. You can set an override below.
  # Make sure to provide the appropriate keys for whatever you set.
  geocoding_engine: Mapbox
  geocode_field_label: _(Enter an address...)
  geocode_hint: [83.45,27.62]  # top, left, bottom, right

  options:
    center:
      lat: 27.62
      lng: 83.45
    zoom: 14
    minZoom: 10
    maxZoom: 20
    scrollWheelZoom: false
  layers:
    # Raster Tile Layers
    # ==================
    # - url: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
    #   attribution: '&copy; OpenStreetMap contributors, CC-BY-SA. <a href="http://mapbox.com/about/maps" target="_blank">Terms &amp; Feedback</a>. Geocoding Courtesy of <a href="http://www.mapquest.com/" target="_blank">MapQuest</a> <img src="http://developer.mapquest.com/content/osm/mq_logo.png">.'

    # Mapbox GL Layers
    # ================
    - type: mapbox
      style: mapbox://styles/mapbox/streets-v12
      accessToken:
      fallback:
        url: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
        attribution: '&copy; OpenStreetMap contributors, CC-BY-SA. <a href="http://mapbox.com/about/maps" target="_blank">Terms &amp; Feedback</a>. Geocoding Courtesy of <a href="http://www.mapquest.com/" target="_blank">MapQuest</a> <img src="http://developer.mapquest.com/content/osm/mq_logo.png">.'

    # GeoJSON Layers
    # ==============
    # District outlines. One file per district, all styled the same so the map
    # reads as one coverage area rather than three separate shapes.
    #
    # butwal.geojson is misnamed - it is the whole of RUPANDEHI district, not
    # Butwal municipality. Left as-is because the filename is baked into the
    # deployed static bundle; renaming it buys nothing and risks a 404.
    #
    # To add a district: fetch its OSM relation (admin_level 6 is a district in
    # Nepal - search the DEVANAGARI name, the English one is only a secondary
    # tag), simplify it, save it here, and add three lines below.
    - url: /static/data/butwal.geojson
      type: json
      rules: &district-outline
        - condition: 'true'
          style:
            color: "#444"
            opacity: 0.6
            fillOpacity: 0.1
            weight: 1

    - url: /static/data/kaski.geojson
      type: json
      rules: *district-outline

    - url: /static/data/chitwan.geojson
      type: json
      rules: *district-outline

# The keys show up in the dropdown list when you are adding a new place
# The values map the place type to map icons (defined below).
#
# Pin colors mean AVAILABILITY, not room type:
#   green (4bbd45)  = available now (answered "free now", OR the picked month
#                     has arrived — the pin flips on its own)
#   orange (f95016) = occupied — free after the stored date
#   blue (0d85e9)   = "not sure yet", and the catch-all
# free_ts is an epoch-milliseconds string saved by the add-place form.
# Places saved before this feature have no free_ts: Number("undefined")
# is NaN, every ">" check is false, so they fall through to green.
#
# The auto-flip is deliberate (Satish's call): the month is named by the
# final-year student who is leaving that very room, and anyone who does not
# know picks "Not sure yet", which stores no timestamp and never expires.
# Accepted risk: nobody revisits the room after the date, so a quickly
# re-let room keeps saying "Available now". Revisit if students start
# reporting rooms that were already taken.
place_types:
  single_room:
    label: _(Single Room)
    # Order is load-bearing: a bare '{{layer.focused}} === true' would
    # swallow every focused pin, so the focused variants come first, most
    # specific first.
    #
    # Two rules to keep in mind when editing:
    #  * ALWAYS quote "{{free_state}}". L.Argo.t splices the raw value into
    #    the condition text and eval()s it with no try/catch, so an unquoted
    #    value becomes a bare identifier and throws out of initLayer — the
    #    pin then does not render at all. A missing key substitutes the
    #    literal string "undefined", which safely fails every ===.
    #  * ALWAYS guard the free_ts comparisons with Number(...) > 0. An "ask"
    #    room stores free_ts as "", and Number("") is 0, so an unguarded
    #    `<= Date.now()` would paint every blue pin green.
    #
    # The catch-all is BLUE, not green. Green now has to be earned by an
    # explicit answer, so legacy rows, a stale cached bundle mid-deploy, or
    # a future typo all fail toward "go and ask" rather than toward
    # "walk twenty minutes to a room that is already taken".
    rules: &availability-rules
      - condition: '{{layer.focused}} === true && "{{free_state}}" !== "ask" && Number("{{free_ts}}") > Date.now()'
        # Focused + free later: big orange marker
        icon:
          iconUrl: /static/css/images/markers/marker-f95016.png
          shadowUrl: /static/css/images/marker-shadow.png
          iconSize: [25, 41]
          shadowSize: [41, 41]
          iconAnchor: [12, 41]

      - condition: '{{layer.focused}} === true && ("{{free_state}}" === "now" || ("{{free_state}}" !== "ask" && Number("{{free_ts}}") > 0 && Number("{{free_ts}}") <= Date.now()))'
        # Focused + available now: big green marker
        icon:
          iconUrl: /static/css/images/markers/marker-4bbd45.png
          shadowUrl: /static/css/images/marker-shadow.png
          iconSize: [25, 41]
          shadowSize: [41, 41]
          iconAnchor: [12, 41]

      - condition: '{{layer.focused}} === true'
        # Focused + nobody knows yet: big blue marker
        icon:
          iconUrl: /static/css/images/markers/marker-0d85e9.png
          shadowUrl: /static/css/images/marker-shadow.png
          iconSize: [25, 41]
          shadowSize: [41, 41]
          iconAnchor: [12, 41]

      - condition: '"{{free_state}}" !== "ask" && Number("{{free_ts}}") > Date.now()'
        # Free later: orange dot
        icon:
          iconUrl: /static/css/images/markers/dot-f95016.png
          iconSize: [17, 18]
          iconAnchor: [9, 9]

      - condition: '"{{free_state}}" === "now" || ("{{free_state}}" !== "ask" && Number("{{free_ts}}") > 0 && Number("{{free_ts}}") <= Date.now())'
        # Available now: green dot
        icon:
          iconUrl: /static/css/images/markers/dot-4bbd45.png
          iconSize: [17, 18]
          iconAnchor: [9, 9]

      - condition: 'true'
        # Nobody knows yet, or a place saved before this feature: blue dot
        icon:
          iconUrl: /static/css/images/markers/dot-0d85e9.png
          iconSize: [17, 18]
          iconAnchor: [9, 9]

  double_room:
    label: _(Double Room)
    rules: *availability-rules

  flat:
    label: _(Flat)
    rules: *availability-rules


activity:
  # On, but shown as a single-line strip on phones (flavor CSS): the full
  # list used to eat half the screen.
  enabled: true
  # How often to refresh the activity list, in milliseconds.
  interval: 30000

place:
  adding_supported:
    from: '2017-03-07 00:00 -0500'   # Daylight savings begins mid-March
    until: '2099-04-07 00:00 -0400'  # and ends mid-October.
  editors: place-editors
  moderators: place-editors
  response_name: _(place)
  response_plural_name: _(places)
  add_button_label: _(Add a Place)
  # Labels for the buttons that toggle the map and list views
  show_list_button_label: _(List All Places)
  show_map_button_label: _(Show the Map)
  action_text: _(added)
  title: _(Tell us more...)
  action_text: _(created)
  anonymous_name: _(Someone)
  submit_button_label: _(Submit)

  location_item_name: location

  items:
    - prompt: _(Location Address)
      type: location
      name: address
      placeholder: _(Set by the button above, or drag the map.)
    - prompt: _(Location Name)
      type: text
      name: name
      optional: true
      attrs:
        - key: placeholder
          value: _(Location Name)
        - key: size
          value: 30
    # Radio group, not a select: the three choices stay visible and take one
    # tap. Styled as chips in custom.css. (Field name stays location_type so
    # existing rooms and the pin-colour rules keep working.)
    - prompt: _(Room Type)
      label: _(Room Type)
      type: radiogroup
      options:
        - label: _(Single Room)
          value: single_room
        - label: _(Double Room)
          value: double_room
        - label: _(Flat)
          value: flat
      name: location_type
      attrs:
        - key: required
    - prompt: _(Owner's Contact Number)
      label: _(Owner's Contact Number)
      type: text
      optional: true
      name: contact_number
      attrs:
        - key: placeholder
          value: _(e.g. 9812345678)
        - key: size
          value: 10
        - key: maxlength
          value: 10
        - key: pattern
          value: '[9][6-9][0-9]{8}'
        - key: title
          value: _(Please enter a valid Nepal mobile number starting with 98 or 97 or 96)

    - prompt: _(Description)
      type: textarea
      name: description
      optional: true
      attrs:
        - key: placeholder
          value: _(Description...)
    - prompt: _(Image)
      inputfile_label: _(Add an Image)
      type: file
      name: my_image
      optional: true
      attrs:
        - key: accept
          value: image/*
        - key: data-max-width
          value: 1000
        - key: data-max-height
          value: 1000

survey:
  submission_type: comments
  adding_supported: true

  # Response config
  show_responses: true
  # Set to true if the user should only submit a survey once
  single_submission: false
  response_name: _(comment)
  response_plural_name: _(comments)
  action_text: _(commented on)
  anonymous_name: _(Someone)

  # Survey form config
  title: _(Leave a Comment)
  form_link_text: _(Leave a Comment)
  submit_btn_text: _(Comment)
  items:
    - prompt: _(Comment)
      label: _(Comment)
      type: textarea
      name: comment
      attrs:
        - key: required
    - prompt: _(Your Name)
      type: text
      name: submitter_name
      sticky: true

support:
  submission_type: support
  adding_supported: true
  submit_btn_text: _(Support)
  response_name: _(support)
  response_plural_name: _(supports)
  action_text: supported
  anonymous_name: _(Someone)

pages:
  - title: _(About)
    slug: about
    name: overview
    start_page: true

  # Required by the e-commerce listing rules: the platform must publicly
  # identify the business behind it and say who hears complaints. Linked from
  # the footer of every page, not just the nav.
  - title: _(व्यवसायको विवरण)
    slug: business
    name: business

  # Not shown in the nav (hidden) — opened by the header Sign In link and
  # the add-place welcome. The map keeps running behind the panel.
  - title: _(Sign in)
    slug: signin
    name: signin
    hidden: true

  - title: _(More...)
    pages:
      - title: _(Why Shareabouts?)
        slug: why
        url: /static/pages/why.html

      - title: _(Features)
        slug: features
        url: /static/pages/features.html

      - title: _(Terms of Use)
        slug: terms
        name: terms

      - title: _(Privacy Policy)
        slug: privacy
        name: privacy
  - title: Filter Places
    slug: filter-type
    pages:
      - title: All
        external: true
        url: /filter/all
      - title: _(Single Room)
        url: /filter/single_room
        external: true
      - title: _(Double Room)
        url: /filter/double_room
        external: true
      - title: _(Flat)
        url: /filter/flat
        external: true

  - title: _(Contact)
    slug: contact
    name: contact

notifications:
  on_new_place: true
  submitter_email_field: private-submitter_email
