# Settings for the app
app:
  # HTML Title
  title: Bhadaghar
  # Header name
  name: Bhada Ghar
  # Meta description that will show up in Google search results
  meta_description: _(Bhadaghar is a mapping tool to gather crowd sourced public input. Use it to collect suggested locations and comments in a social, engaging process.)
  # Meta author that will show up in Google search results
  meta_author: OpenPlans.org


  # When the map loads, existing places will be loaded in chunks. By default,
  # the size of the chunks will be a reasonable default dictated by the API
  # server. If you would like to override the chunk size, use this setting:
  # places_page_size: 100

  # Optional. List view is supported by default. Set to false to disable.
  # list_enabled: false

# Settings for map and layer configs
map:
  geolocation_enabled: true
  geolocation_onload: false

  geocoding_enabled: true
  # The default geocoding engine is MapQuest. You can set an override below.
  # Make sure to provide the appropriate keys for whatever you set.
  geocoding_engine: Mapbox
  geocode_field_label: _(Enter an address...)
  geocode_hint: [83.45,27.62]  # top, left, bottom, right

  options:
    center:
      lat: 27.62
      lng: 83.45
    zoom: 14
    minZoom: 10
    maxZoom: 20
    scrollWheelZoom: false
  layers:
    # Raster Tile Layers
    # ==================
    # - url: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
    #   attribution: '&copy; OpenStreetMap contributors, CC-BY-SA. <a href="http://mapbox.com/about/maps" target="_blank">Terms &amp; Feedback</a>. Geocoding Courtesy of <a href="http://www.mapquest.com/" target="_blank">MapQuest</a> <img src="http://developer.mapquest.com/content/osm/mq_logo.png">.'

    # Mapbox GL Layers
    # ================
    - type: mapbox
      style: mapbox://styles/mapbox/streets-v8
      accessToken:
      fallback:
        url: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
        attribution: '&copy; OpenStreetMap contributors, CC-BY-SA. <a href="http://mapbox.com/about/maps" target="_blank">Terms &amp; Feedback</a>. Geocoding Courtesy of <a href="http://www.mapquest.com/" target="_blank">MapQuest</a> <img src="http://developer.mapquest.com/content/osm/mq_logo.png">.'

    # GeoJSON Layers
    # ==============
    - url: /static/data/butwal.geojson
      type: json
      rules:
        - condition: 'true'
          style:
            color: "#444"
            opacity: 0.6
            fillOpacity: 0.1
            weight: 1

# The keys show up in the dropdown list when you are adding a new place
# The values map the place type to map icons (defined below).
place_types:
  single_room:
    label: _(Single Room)
    rules:
      - condition: '"{{location_type}}" === "single_room" && {{map.zoom}} < 13 && {{layer.focused}} === false'
        # Display single room as circles (vectors) when zoomed out

        style:
          color: '#0d85e9'
          radius: 3
          weight: 1
          opacity: 0.9
          fillOpacity: 1

      - condition: '"{{location_type}}" === "single_room" && {{map.zoom}} >= 13 && {{layer.focused}} === false'
        # Display single_room as icons when zoomed in

        icon:
          iconUrl: /static/css/images/markers/dot-0d85e9.png
          iconSize: [17, 18]
          iconAnchor: [9, 9]

      - condition: '"{{location_type}}" === "single_room" && {{layer.focused}} === true'
        # Display single_room as icons when focused/selected

        icon:
          iconUrl: /static/css/images/markers/marker-0d85e9.png
          shadowUrl: /static/css/images/marker-shadow.png
          iconSize: [25, 41]
          shadowSize: [41, 41]
          iconAnchor: [12, 41]

  double_room:
    label: _(Double_Room)
    rules:
      - condition: '"{{location_type}}" === "double_room" && {{layer.focused}}'
        # Show parks that are points as icons...

        icon:
          iconUrl: /static/css/images/markers/marker-4bbd45.png
          shadowUrl: /static/css/images/marker-shadow.png
          iconSize: [25, 41]
          shadowSize: [41, 41]
          iconAnchor: [12, 41]

        # ...and parks that are polygons as shapes.

        style:
          color: '#4bbd45'
          weight: 3
          opacity: 0.9
          fillOpacity: 0.7

      - condition: '"{{location_type}}" === "double_room"'
        # Show parks that are points as icons...

        icon:
          iconUrl: /static/css/images/markers/dot-4bbd45.png
          iconSize: [17, 18]
          iconAnchor: [9, 9]

        # ...and parks that are polygons as shapes.

        style:
          color: '#4bbd45'
          weight: 1
          opacity: 0.9
          fillOpacity: 0.4

  flat:
    label: _(Flat)
    rules:
      - condition: '"{{location_type}}" === "flat" && {{layer.focused}} === true'
        # Display flat as a large marker when focused/selected

        icon:
          iconUrl: /static/css/images/markers/marker-f95016.png
          shadowUrl: /static/css/images/marker-shadow.png
          iconSize: [25, 41]
          shadowSize: [41, 41]
          iconAnchor: [12, 41]

      - condition: '"{{location_type}}" === "flat"'
        # Display flat as an orange dot icon

        icon:
          iconUrl: /static/css/images/markers/dot-f95016.png
          iconSize: [17, 18]
          iconAnchor: [9, 9]


activity:
  # Optional. Activity is supported by default. Set to false to disable.
  enabled: true
  # How often to refresh the activity list, in milliseconds.
  interval: 30000

place:
  adding_supported:
    from: '2017-03-07 00:00 -0500'   # Daylight savings begins mid-March
    until: '2099-04-07 00:00 -0400'  # and ends mid-October.
  editors: place-editors
  moderators: place-editors
  response_name: _(place)
  response_plural_name: _(places)
  add_button_label: _(Add a Place)
  # Labels for the buttons that toggle the map and list views
  show_list_button_label: _(List All Places)
  show_map_button_label: _(Show the Map)
  action_text: _(added)
  title: _(Tell us more...)
  action_text: _(created)
  anonymous_name: _(Someone)
  submit_button_label: _(Submit)

  location_item_name: location

  items:
    - prompt: _(Your Name)
      type: text
      name: submitter_name
      optional: true
      sticky: true
      attrs:
        - key: placeholder
          value: _(Name)
        - key: size
          value: 30
    - prompt: _(Your Email)
      type: text
      name: private-submitter_email
      optional: true
      sticky: true
      attrs:
        - key: placeholder
          value: _(Email address)
        - key: size
          value: 30
    - prompt: _(Location Address)
      type: location
      name: address
      placeholder: _(Drag the map to set the location.)
    - prompt: _(Location Name)
      type: text
      name: name
      optional: true
      attrs:
        - key: placeholder
          value: _(Location Name)
        - key: size
          value: 30
    - prompt: _(Location Type)
      type: select
      options:
        - label: _(Choose One)
          value: ''
        - label: _(Single Room)
          value: single_room
        - label: _(Double Room)
          value: double_room
        - label: _(Flat)
          value: flat
      name: location_type
      attrs:
        - key: required
    - prompt: _(Contact Number)
      label: _(Contact Number)
      type: text
      optional: true
      name: contact_number
      attrs:
        - key: placeholder
          value: _(e.g. 9812345678)
        - key: size
          value: 10
        - key: maxlength
          value: 10
        - key: pattern
          value: '[9][6-9][0-9]{8}'
        - key: title
          value: _(Please enter a valid Nepal mobile number starting with 98 or 97 or 96)
   
    - prompt: _(Description)
      type: textarea
      name: description
      optional: true
      attrs:
        - key: placeholder
          value: _(Description...)
    - prompt: _(Image)
      inputfile_label: _(Add an Image)
      type: file
      name: my_image
      optional: true
      attrs:
        - key: accept
          value: image/*
        - key: data-max-width
          value: 1000
        - key: data-max-height
          value: 1000

survey:
  submission_type: comments
  adding_supported: true

  # Response config
  show_responses: true
  # Set to true if the user should only submit a survey once
  single_submission: false
  response_name: _(comment)
  response_plural_name: _(comments)
  action_text: _(commented on)
  anonymous_name: _(Someone)

  # Survey form config
  title: _(Leave a Comment)
  form_link_text: _(Leave a Comment)
  submit_btn_text: _(Comment)
  items:
    - prompt: _(Comment)
      label: _(Comment)
      type: textarea
      name: comment
      attrs:
        - key: required
    - prompt: _(Your Name)
      type: text
      name: submitter_name
      sticky: true

support:
  submission_type: support
  adding_supported: true
  submit_btn_text: _(Support)
  response_name: _(support)
  response_plural_name: _(supports)
  action_text: supported
  anonymous_name: _(Someone)

pages:
  - title: _(About)
    slug: about
    name: overview
    start_page: true

  - title: _(More...)
    pages:
      - title: _(Why Shareabouts?)
        slug: why
        url: /static/pages/why.html

      - title: _(Features)
        slug: features
        url: /static/pages/features.html

      - title: _(Terms of Use)
        slug: terms
        name: terms

      - title: _(Privacy Policy)
        slug: privacy
        name: privacy
  - title: Filter Places
    slug: filter-type
    pages:
      - title: All
        external: true
        url: /filter/all
      - title: _(Single Room)
        url: /filter/single_room
        external: true
      - title: _(Double Room)
        url: /filter/double_room
        external: true
      - title: _(Flat)
        url: /filter/flat
        external: true

  - title: _(Contact)
    slug: contact
    name: contact

notifications:
  on_new_place: true
  submitter_email_field: private-submitter_email
